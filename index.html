<!DOCTYPE html>
<html lang="en">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STEVEN UNIVERSE SIMILARITIES</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600&display=swap');
*{box-sizing:border-box}
body{margin:0;background:#0a0208;color:#ffd6ec;font-family:'Inter',system-ui;min-height:100vh}
.top{padding:18px 16px 14px;background:linear-gradient(180deg,#1e0a18 0%,#12060f 100%);border-bottom:1px solid #FF69B433;text-align:center}
.top h1{margin:0;font-family:'Orbitron',monospace;font-size:22px;font-weight:900;letter-spacing:0.14em;color:#FF69B4;text-shadow:0 0 18px rgba(255,105,180,0.7),0 0 40px rgba(255,105,180,0.25);line-height:1}
.top .line{height:2px;background:linear-gradient(90deg,transparent,#FF69B4,transparent);margin:10px auto 0;width:60%;opacity:.6}
.controls{padding:12px;background:#120a10;display:grid;gap:8px;border-bottom:1px solid #2a1430}
select,input{width:100%;padding:13px 14px;background:#1e0f1a;border:1px solid #5a2a4a;color:#ffb8dc;border-radius:12px;font-size:14px;outline:none}
select:focus,input:focus{border-color:#FF69B4;box-shadow:0 0 0 3px rgba(255,105,180,0.22)}
.hint{padding:14px 16px;text-align:center;color:#7a4a64;font-size:12px;letter-spacing:.04em;line-height:1.5}
.list{padding:10px 12px;display:grid;gap:10px}
.card{width:100%;text-align:left;background:radial-gradient(120% 120% at 0% 0%,#2a1430,#1c0e1a);border:1px solid #4a2340;border-radius:16px;padding:13px;cursor:pointer;transition:.18s;box-shadow:0 2px 12px rgba(0,0,0,.3)}
.card:hover{border-color:#FF69B4;transform:translateY(-2px);box-shadow:0 10px 28px rgba(255,105,180,.25)}
.card .t{font-family:'Orbitron',monospace;color:#FF69B4;font-weight:700;font-size:14px;letter-spacing:.06em}
.card .m{font-size:10px;color:#b07090;margin-top:3px}
.card .p{font-size:11px;color:#e0a8c4;margin-top:7px;line-height:1.45;opacity:.9;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.result{margin:12px;border:1px solid #FF69B4;border-radius:18px;padding:16px;background:linear-gradient(135deg,#2a1430,#1e0e1a);box-shadow:0 0 24px rgba(255,105,180,.15)}
.result h2{margin:0;font-family:'Orbitron',monospace;color:#FF69B4;font-size:20px;letter-spacing:.08em;text-shadow:0 0 12px rgba(255,105,180,.5)}
.tag{display:inline-block;background:#2a1022;border:1px solid #FF69B440;color:#FF69B4;font-size:10px;padding:4px 10px;border-radius:20px;margin:4px 4px 0 0}
.sim{padding:10px 12px 30px}
.sim h3{font-family:'Orbitron',monospace;font-size:11px;letter-spacing:.18em;color:#FF69B4;margin:14px 0 10px;opacity:.9}
.grid{display:grid;gap:10px}
@media(min-width:650px){.grid{grid-template-columns:1fr 1fr}}
.item{width:100%;text-align:left;background:#1f0f1b;border:1px solid #4a2a44;border-radius:14px;padding:12px;cursor:pointer;transition:.15s}
.item:hover{border-color:#ff88cc;transform:translateY(-1px)}
.small{font-size:11px;color:#a06a86;line-height:1.4}
</style>
</head>
<body>
<div class="top">
<h1>STEVEN UNIVERSE SIMILARITIES</h1>
<div class="line"></div>
</div>

<div class="controls">
<select id="tab" onchange="onTabChange()">
<option value="all">All - SU + Future + Movie</option>
<option value="su">Steven Universe 2013-2019</option>
<option value="future">Steven Universe Future</option>
</select>
<select id="season" onchange="onSeasonChange()"></select>
<input id="search" placeholder="Type episode title or number — e.g. Volleyball, 19, Mirror Gem..." oninput="onSearch()" autofocus>
</div>

<div id="hint" class="hint">Select version + season above, then type an episode title or number. No episodes shown until you search.</div>
<div class="list" id="epList"></div>

<div class="result" id="result" style="display:none">
<h2 id="resTitle"></h2>
<div class="small" id="resMeta"></div>
<p style="font-size:13px;line-height:1.6;margin:12px 0;color:#ffd6ec" id="resPlot"></p>
<div id="resTags"></div>
<div class="small" style="margin-top:10px;font-style:italic;color:#d9a0bc" id="resReview"></div>
</div>

<div class="sim" id="simSection" style="display:none">
<h3>9 MOST SIMILAR</h3>
<div class="grid" id="similar"></div>
<div class="small" id="simNote" style="margin-top:10px;opacity:.7"></div>
</div>

<script>
const EPISODES=[
{id:"su-s1e1",series:"SU",season:1,ep:1,title:"Gem Glow",year:2013,plot:"Steven thinks ice cream sandwiches summon shield but learns otherwise vs acid insect monster.",themes:["origin","shield","first power"],review:"Shield debut"},
{id:"su-s1e7",series:"SU",season:1,ep:7,title:"Bubble Buddies",year:2013,plot:"Steven bubbles himself with Connie to protect her from falling.",themes:["connie","bubble","protection"],review:"First Connie bubble"},
{id:"su-s1e25",series:"SU",season:1,ep:25,title:"Mirror Gem",year:2014,plot:"Lapis Lazuli trapped in mirror, Steven frees her. Prisoner for months.",themes:["lapis","mirror","trapped","prison"],review:"Lapis trapped reveal"},
{id:"su-s1e26",series:"SU",season:1,ep:26,title:"Ocean Gem",year:2014,plot:"Lapis steals entire ocean to return to Homeworld.",themes:["lapis","ocean theft","escape"],review:"Ocean stolen"},
{id:"su-s1e35",series:"SU",season:1,ep:35,title:"Lion 3 Straight to Video",year:2014,plot:"Lion's VHS tape reveals Rose Quartz's secret message for Steven.",themes:["lion","tape","rose secret","message"],review:"Fan favorite 9.3"},
{id:"su-s2e2",series:"SU",season:2,ep:2,title:"Alone Together",year:2015,plot:"Steven fuses with Connie for first time into Stevonnie, explores identity and consent.",themes:["stevonnie","first fusion","connie","identity","fusion"],review:"First Stevonnie"},
{id:"su-s2e14",series:"SU",season:2,ep:14,title:"The Return",year:2015,plot:"Jasper and Peridot return to Earth, Crystal Gems prepare for war.",themes:["jasper","peridot","invasion","war"],review:"Jasper returns 8.8"},
{id:"su-s2e15",series:"SU",season:2,ep:15,title:"Jail Break",year:2015,plot:"Ruby and Sapphire reunite, Garnet reforms, sings Stronger Than You.",themes:["garnet reunion","ruby sapphire","fusion love","song"],review:"Stronger Than You"},
{id:"su-s2e23",series:"SU",season:2,ep:23,title:"Sworn to the Sword",year:2015,plot:"Pearl trains Connie to be knight, reveals devotion to Rose.",themes:["pearl","connie training","devotion","rose"],review:"Pearl devotion 8.9"},
{id:"su-s3e2",series:"SU",season:3,ep:2,title:"The Answer",year:2016,plot:"Garnet origin: Ruby and Sapphire first fuse to save each other.",themes:["garnet origin","ruby sapphire","first fusion","love"],review:"Garnet origin 8.6"},
{id:"su-s3e20",series:"SU",season:3,ep:20,title:"Bismuth",year:2016,plot:"Bismuth returns, reveals Rose bubbled her for wanting to shatter gems.",themes:["bismuth","rose secret","bubbled","shattering"],review:"Bubbled secret"},
{id:"su-s3e24",series:"SU",season:3,ep:24,title:"Mr Greg",year:2016,plot:"Greg has millions, musical episode, sings to Pearl about moving on.",themes:["greg","musical","money","moving on","pearl"],review:"Musical 9.1"},
{id:"su-s4e4",series:"SU",season:4,ep:4,title:"Mindful Education",year:2016,plot:"Stevonnie and Connie meditate, Bismuth memory, fusion anxiety.",themes:["stevonnie","meditation","fusion anxiety","bismuth"],review:"Meditation 8.9"},
{id:"su-s4e6",series:"SU",season:4,ep:6,title:"Last One Out of Beach City",year:2016,plot:"Pearl and Garnet road trip, Pearl flirts, discovers humanity.",themes:["pearl","garnet","road trip","humanity"],review:"Road trip 9.0"},
{id:"su-s5e18",series:"SU",season:5,ep:18,title:"A Single Pale Rose",year:2018,plot:"Pearl reveals she was original Pink Diamond's Pearl, Rose is Pink Diamond.",themes:["pearl reveal","pink diamond","rose is pink","secret","identity"],review:"Biggest reveal 8.9"},
{id:"su-s5e24",series:"SU",season:5,ep:24,title:"Legs From Here to Homeworld",year:2018,plot:"Steven goes to Homeworld to convince White Diamond to heal corrupted gems.",themes:["homeworld","white diamond","healing","convince"],review:"Homeworld trip 9.4"},
{id:"su-s5e28",series:"SU",season:5,ep:28,title:"Change Your Mind",year:2019,plot:"Steven convinces White Diamond that flawed is okay, all corrupted gems healed, finale.",themes:["white diamond","healing","finale","flawed","corruption healed"],review:"Finale 9.6 - highest rated"},
{id:"su-mov",series:"SU",season:5,ep:29,title:"Steven Universe The Movie",year:2019,plot:"Spinel attacks Earth after Steven's gem reset, musical about growing up.",themes:["spinel","gem reset","musical","growing up","heart"],review:"Movie musical 8.3"},
{id:"fu-4",series:"Future",season:1,ep:4,title:"Volleyball",year:2019,plot:"Pink Pearl with scar, Steven helps heal trauma from Pink Diamond abuse.",themes:["pink pearl","scar","trauma","healing","pearl trauma","abuse"],review:"Pearl trauma 9.2"},
{id:"fu-14",series:"Future",season:1,ep:14,title:"Growing Pains",year:2020,plot:"Steven's body morphs horribly, hospital, body horror, trauma physical.",themes:["body horror","morphing","hospital","trauma","growing pains"],review:"Body horror 9.0"},
{id:"fu-16",series:"Future",season:1,ep:16,title:"Fragments",year:2020,plot:"Steven runs to Jasper, shatters Jasper in rage, turns dark pink.",themes:["jasper","shattering","rage","dark steven","monster","fragments"],review:"Dark Steven 9.2 shatters Jasper"},
{id:"fu-19",series:"Future",season:1,ep:19,title:"I Am My Monster",year:2020,plot:"All trauma accumulated releases as giant pink kaiju monster destroying town.",themes:["monster","trauma release","kaiju","destruction","pink monster"],review:"Kaiju trauma 9.3"},
{id:"fu-20",series:"Future",season:1,ep:20,title:"The Future",year:2020,plot:"Steven finally ready to move on, leaves Beach City to find himself.",themes:["moving on","leaving","future","ending","goodbye"],review:"Finale moving on 8.9"}
];

let currentTab="all";
let currentSeasonVal="all";

function getFilteredByTabAndSeason(){
 let tab=document.getElementById('tab').value;
 let seasonVal=document.getElementById('season').value;
 let eps=EPISODES.filter(e=> tab==="all" || (tab==="su" && e.series==="SU") || (tab==="future" && e.series==="Future"));
 if(seasonVal!=="all"){
  let parts=seasonVal.split('-');
  if(parts[0]==="su") eps=eps.filter(e=>e.series==="SU" && e.season==parseInt(parts[1]));
  else if(parts[0]==="future") eps=eps.filter(e=>e.series==="Future");
 }
 return eps;
}

function loadSeasons(){
 const tab=document.getElementById('tab').value;
 currentTab=tab;
 const sel=document.getElementById('season'); sel.innerHTML='';
 if(tab==="all"||tab==="su"){
  let seasons=[...new Set(EPISODES.filter(e=>e.series==="SU").map(e=>e.season))];
  seasons.forEach(s=>{let o=document.createElement('option');o.value="su-"+s;o.textContent="SU Season "+s; sel.appendChild(o);});
 }
 if(tab==="all"||tab==="future"){
  let o=document.createElement('option');o.value="future-1";o.textContent="Future Season 1"; sel.appendChild(o);
 }
 let o2=document.createElement('option');o2.value="all";o2.textContent="All Seasons"; sel.appendChild(o2);
 sel.value="all";
 currentSeasonVal="all";
 clearAll();
}

function onTabChange(){ loadSeasons(); }
function onSeasonChange(){
 currentSeasonVal=document.getElementById('season').value;
 clearAll();
 document.getElementById('search').value="";
 document.getElementById('hint').style.display="block";
 document.getElementById('hint').textContent="Season changed to "+document.getElementById('season').selectedOptions[0].textContent+". Now type episode title or number.";
}

function clearAll(){
 document.getElementById('epList').innerHTML="";
 document.getElementById('result').style.display="none";
 document.getElementById('simSection').style.display="none";
 document.getElementById('similar').innerHTML="";
}

function onSearch(){
 const q=document.getElementById('search').value.toLowerCase().trim();
 const list=document.getElementById('epList');
 const hint=document.getElementById('hint');
 if(!q){
  list.innerHTML="";
  hint.style.display="block";
  hint.textContent="Type episode title or number — e.g. Volleyball, 19, Mirror Gem...";
  document.getElementById('result').style.display="none";
  document.getElementById('simSection').style.display="none";
  return;
 }
 hint.style.display="none";
 let base=getFilteredByTabAndSeason();
 let filtered=base.filter(e=>{
  let hay=(e.title+" "+e.ep+" "+e.season+" "+e.themes.join(" ")+" "+e.plot).toLowerCase();
  return hay.includes(q);
 });
 renderList(filtered);
 if(filtered.length===0){
  list.innerHTML=`<div class="hint">No episodes found for "${q}" in ${document.getElementById('season').selectedOptions[0].textContent}</div>`;
 }
}

function renderList(eps){
 const list=document.getElementById('epList'); list.innerHTML='';
 eps.forEach(ep=>{
  let b=document.createElement('button'); b.className='card';
  b.innerHTML=`<div class="t">${ep.title}</div><div class="m">${ep.series} S${ep.season}E${ep.ep} • ${ep.year} • ${ep.themes.slice(0,3).join(', ')}</div><div class="p">${ep.plot}</div>`;
  b.onclick=()=>selectEp(ep); list.appendChild(b);
 });
}

function similarity(a,b){
 let overlap=a.themes.filter(t=>b.themes.includes(t));
 let score=overlap.length*3;
 let wordsA=new Set(a.plot.toLowerCase().split(/\W+/).filter(w=>w.length>3));
 let wordsB=new Set(b.plot.toLowerCase().split(/\W+/).filter(w=>w.length>3));
 let shared=[...wordsA].filter(w=>wordsB.has(w));
 score+=shared.length*0.3;
 return {score,overlap,shared};
}

function selectEp(ep){
 document.getElementById('result').style.display='block';
 document.getElementById('resTitle').textContent=ep.title;
 document.getElementById('resMeta').textContent=`${ep.series} S${ep.season}E${ep.ep} • ${ep.year}`;
 document.getElementById('resPlot').textContent=ep.plot;
 document.getElementById('resTags').innerHTML=ep.themes.map(t=>`<span class="tag">${t}</span>`).join('');
 document.getElementById('resReview').textContent=ep.review;

 // similar pool based on current season selection
 let base=getFilteredByTabAndSeason();
 let pool=base.filter(x=>x.id!==ep.id);

 let scored=pool.map(o=>{let sim=similarity(ep,o); return {ep:o,score:sim.score,overlap:sim.overlap};});
 scored.sort((a,b)=>b.score-a.score);
 let top=scored.slice(0,9);

 document.getElementById('simSection').style.display='block';
 let div=document.getElementById('similar'); div.innerHTML='';
 let seasonName=document.getElementById('season').selectedOptions[0].textContent;
 document.getElementById('simNote').textContent=`Showing 9 most similar from ${seasonName} (excluding the episode you picked).`;

 if(top.length===0){
  div.innerHTML=`<div class="small">No other episodes in ${seasonName} to compare.</div>`;
  return;
 }

 top.forEach((s,i)=>{
  let d=document.createElement('button'); d.className='item';
  d.innerHTML=`<div class="small">#${i+1} • ${s.score.toFixed(1)} pts • ${s.overlap.join(', ')||'plot similar'}</div><div style="font-weight:700;margin:5px 0;color:#ff88cc">${s.ep.title}</div><div class="small">${s.ep.series} S${s.ep.season}E${s.ep.ep} • ${s.ep.year}</div><div class="small" style="margin-top:5px">${s.ep.plot.substring(0,110)}...</div><div class="small" style="margin-top:4px;font-style:italic">${s.ep.review}</div>`;
  d.onclick=()=>{selectEp(s.ep); window.scrollTo({top:0,behavior:'smooth'});}; div.appendChild(d);
 });
 // scroll to result
 document.getElementById('result').scrollIntoView({behavior:'smooth',block:'start'});
}

loadSeasons();
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
